name: Release 0.2
on:
  push:
    tags: ['0.2']
  workflow_dispatch:
    inputs:
      macos_only:
        description: Rebuild only the separate macOS packages
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - name: Build Windows portable
        if: runner.os == 'Windows' && !inputs.macos_only
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -PortableOnly
      - name: Build macOS ${{ matrix.arch }}
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          bash packaging/macos/package.sh --arch ${{ matrix.arch }}
          ditto -c -k --keepParent target/macos-package/PhotoCraft.app dist/release/photocraft-0.2.0-macos-${{ matrix.arch }}-app.zip
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows' || !inputs.macos_only
        with:
          name: photocraft-0.2-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish 0.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view 0.2 >/dev/null 2>&1 || gh release create 0.2 --target "$GITHUB_SHA" --title 'PhotoCraft 0.2' --notes 'C3 笔刷分类与混色更新。Windows x64 绿色版；macOS 独立架构版（Apple Silicon / Intel，本地签名，未公证）。'
          gh release upload 0.2 artifacts/* --clobber
          gh release edit 0.2 --notes 'C3 笔刷分类与混色更新。Windows x64 绿色版；macOS 分为 Apple Silicon（aarch64）和 Intel（x86_64）独立包，本地签名、未公证。'
          for asset in photocraft-0.2.0-macos-universal.dmg photocraft-0.2.0-macos-universal-app.zip photocraft-cli-0.2.0-macos-universal.zip; do
            if gh release view 0.2 --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset 0.2 "$asset" --yes
            fi
          done

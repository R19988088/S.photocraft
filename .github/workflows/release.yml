name: Release 0.23.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            artifact: photocraft-0.23.5-windows-x64-portable.zip
          - os: macos-15
            platform: macos-arm64
            artifact: photocraft-0.23.5-macos-aarch64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0.23.5'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-0.23.5-${{ matrix.platform }}
          cache-on-failure: true
      - name: Build Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -PortableOnly
      - name: Verify Windows PDF imports
        if: runner.os == 'Windows'
        run: python packaging/windows/check-pdf-imports.py target/x86_64-pc-windows-msvc/release/photocraft.exe target/x86_64-pc-windows-msvc/release/photocraft-cli.exe
      - name: Build Apple Silicon DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          bash packaging/macos/package.sh --arch aarch64
          lipo target/macos-package/PhotoCraft.app/Contents/MacOS/PhotoCraft -verify_arch arm64
          codesign --verify --strict target/macos-package/PhotoCraft.app
          hdiutil verify dist/release/photocraft-0.23.5-macos-aarch64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-0.23.5-${{ matrix.platform }}
          path: dist/release/${{ matrix.artifact }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish 0.23.5 packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s artifacts/photocraft-0.23.5-windows-x64-portable.zip
          test -s artifacts/photocraft-0.23.5-macos-aarch64.dmg
          gh release view 0.23.5 >/dev/null 2>&1 || gh release create 0.23.5 --verify-tag --title 'PhotoCraft 0.23.5' --notes '基于 0.23 的独立 GPU 缓存液化工具。Windows x64 ZIP 便携版；Apple Silicon macOS DMG（ad-hoc 签名，未公证）。'
          gh release upload 0.23.5 artifacts/* --clobber

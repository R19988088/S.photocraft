name: Release 0.23
on:
  push:
    tags: ['0.23']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - name: Test optional Windows PDF loader
        if: runner.os == 'Windows'
        run: cargo test --locked -p winprint --no-default-features --lib pdf_renderer_
      - name: Build Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -PortableOnly
      - name: Verify Windows PDF imports
        if: runner.os == 'Windows'
        run: python packaging/windows/check-pdf-imports.py target/x86_64-pc-windows-msvc/release/photocraft.exe target/x86_64-pc-windows-msvc/release/photocraft-cli.exe
      - name: Build macOS ${{ matrix.arch }}
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          bash packaging/macos/package.sh --arch ${{ matrix.arch }}
          lipo target/macos-package/PhotoCraft.app/Contents/MacOS/PhotoCraft -verify_arch ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
          codesign --verify --strict target/macos-package/PhotoCraft.app
          ditto -c -k --keepParent target/macos-package/PhotoCraft.app dist/release/photocraft-0.23.0-macos-${{ matrix.arch }}-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-0.23-${{ matrix.platform }}
          path: |
            dist/release/*-portable.zip
            dist/release/*-app.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish 0.23
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view 0.23 >/dev/null 2>&1 || gh release create 0.23 --target "$GITHUB_SHA" --title 'PhotoCraft 0.23' --notes '修复部分 Windows 系统缺少 PDF 组件时无法启动的问题：仅在需要 PDF 打印时加载组件，缺失时提示。Windows x64 便携版；macOS Apple Silicon / Intel 独立包（本地签名、未公证）。'
          gh release upload 0.23 artifacts/* --clobber

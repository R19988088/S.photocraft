name: Release 0.24
on:
  push:
    tags: ['0.24']
  workflow_dispatch:
    inputs:
      macos_run_id:
        description: Reuse completed macOS artifacts from this run; rebuild Windows only
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'Windows' || !inputs.macos_run_id
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows' || !inputs.macos_run_id
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows' || !inputs.macos_run_id
        with:
          key: release-${{ matrix.platform }}
          cache-on-failure: true
      - name: Test optional Windows PDF loader
        if: runner.os == 'Windows'
        run: cargo test --locked -p winprint --no-default-features --lib pdf_renderer_
      - name: Build Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -PortableOnly
      - name: Verify Windows PDF imports
        if: runner.os == 'Windows'
        run: python packaging/windows/check-pdf-imports.py target/x86_64-pc-windows-msvc/release/photocraft.exe target/x86_64-pc-windows-msvc/release/photocraft-cli.exe
      - name: Build macOS ${{ matrix.arch }}
        if: runner.os == 'macOS' && !inputs.macos_run_id
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          bash packaging/macos/package.sh --arch ${{ matrix.arch }}
          lipo target/macos-package/PhotoCraft.app/Contents/MacOS/PhotoCraft -verify_arch ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
          codesign --verify --strict target/macos-package/PhotoCraft.app
          ditto -c -k --keepParent target/macos-package/PhotoCraft.app dist/release/photocraft-0.24.0-macos-${{ matrix.arch }}-app.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' || !inputs.macos_run_id
        with:
          name: photocraft-0.24-${{ matrix.platform }}
          path: |
            dist/release/*-portable.zip
            dist/release/*-app.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Reuse macOS packages
        if: inputs.macos_run_id
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.macos_run_id }}
          pattern: photocraft-0.24-macos-*
          path: artifacts
          merge-multiple: true
      - name: Publish 0.24
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f artifacts/photocraft-0.24.0-windows-x64-portable.zip
          test -f artifacts/photocraft-0.24.0-macos-aarch64-app.zip
          test -f artifacts/photocraft-0.24.0-macos-x86_64-app.zip
          gh release view 0.24 >/dev/null 2>&1 || gh release create 0.24 --target "$GITHUB_SHA" --title 'PhotoCraft 0.24 — 变形和液化修改' --notes '移动、变形和液化改用 GPU 常驻缓存预览，支持图层、全部图层、图层组三种范围；回车或切换工具时统一提交。修复液化拖动和预览缓存冲突。Windows x64 便携版；macOS Apple Silicon / Intel 独立包（本地签名、未公证）。'
          gh release upload 0.24 artifacts/* --clobber
